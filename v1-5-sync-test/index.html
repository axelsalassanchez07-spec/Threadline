async function persistPrefs(){await write('prefs',{...state.prefs,id:'user'});await refresh()}
let toastTimer;function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
function garmentSVG(item){const col=COLORS[item.color]||'#9ba69a';const ink='#20372f';const kind=(item.kind||'').toLowerCase();let body='';if(item.category==='Bottoms'){
body=`<path d="M60 43H160L151 203H114l-11-111-10 111H56Z" fill="${col}" stroke="${ink}" stroke-width="2.2"/><path d="M60 61h100M109 43v49M85 44l13 19M132 44l-15 19" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="2"/>`;
if(kind.includes('pleated'))body+=`<path d="M88 69 78 189M133 69l12 119" stroke="#ffffff" stroke-opacity=".42" stroke-width="2"/>`;
}else if(item.category==='Shoes'){body=`<path d="M23 122c20 0 35-16 44-31l22 13 18 24c9 4 19 7 29 8l5 17c-31 9-86 9-118 1z" fill="${col}" stroke="${ink}" stroke-width="2"/><path d="M91 148c22 0 40-1 48-5M61 114l26 15m-16-20 22 14" stroke="#ffffff" stroke-width="3"/><path d="M89 171c19 0 33-13 42-28l20 12 33 12 5 16c-34 8-78 6-102 1Z" fill="${col}" stroke="${ink}" stroke-width="2"/><path d="m122 161 19 14m-10-17 19 13" stroke="#ffffff" stroke-width="3"/>`;
}else if(item.category==='Accessories'){body=`<path d="M60 100q12-65 55-60 44 2 50 60l-5 30H67z" fill="${col}" stroke="${ink}" stroke-width="2"/><path d="M65 116q45-20 97 0 23 20-3 24H50q-17-4 15-24" fill="${col}" stroke="${ink}" stroke-width="2"/>`;
}else{const outer=item.category==='Outerwear';body=`<path d="M75 40 37 57 18 119l28 13 20-42-5 114h98l-6-114 20 42 28-13-19-62-38-17-15 16h-36Z" fill="${col}" stroke="${ink}" stroke-width="2.1"/><path d="M93 40q17 22 34 0" fill="none" stroke="${ink}" stroke-width="2"/>`;
if(kind.includes('shirt')||kind.includes('polo')||kind.includes('rugby'))body+=`<path d="M93 41 110 67l17-26-12 9-5 17-5-17z" fill="#fff" fill-opacity=".45" stroke="${ink}" stroke-opacity=".4"/>`;
if(outer)body+=`<path d="M110 60v143M75 124h23v20H75zm47 0h23v20h-23z" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="2.5"/>`;
if(kind.includes('cardigan')||kind.includes('jacket'))body+=`<path d="M110 56v147M100 85h2m7 15h2m-2 18h2" stroke="${ink}" stroke-width="2"/>`;
if(kind.includes('rugby'))body+=`<path d="M49 111h122M56 151h107" stroke="#ffffff" stroke-width="14" stroke-opacity=".42"/>`;
}return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="220" height="240" viewBox="0 0 220 240"><rect width="220" height="240" fill="#f0f1ec"/><circle cx="177" cy="45" r="40" fill="#e4e8df"/><circle cx="35" cy="212" r="65" fill="#e9e9e1"/>${body}</svg>`)}`}
function imageHTML(item,cls=''){return item.image?`<img class="user-photo ${cls}" alt="${esc(item.name)}" loading="lazy" src="${esc(item.image)}">`:`<div class="photo-needed"><span>▧</span><small>Photo not added</small></div>`}
const navs=[['home','Overview','home'],['wardrobe','My wardrobe','closet'],['studio','Outfit studio','sparkles'],['shop','Shop real looks','shirt'],['inspiration','Inspiration','image'],['saved','Saved outfits','heart'],['profile','Style profile','user']];
function renderNav(){let desktop=$('#desktop-nav'),mobile=$('#mobile-nav');desktop.innerHTML=navs.map(([id,label,ico])=>`<button data-nav="${id}" class="nav-item ${state.route===id?'active':''}" ${state.route===id?'aria-current="page"':''}><span class="nav-icon">${icon(ico)}</span><span class="nav-text">${label}</span></button>`).join('');mobile.innerHTML=navs.filter(n=>n[0]!=='home').map(([id,label,ico])=>`<button data-nav="${id}" class="${state.route===id?'active':''}" ${state.route===id?'aria-current="page"':''}>${icon(ico)}<span>${label.split(' ')[0]}</span></button>`).join('')}
function pageHead(title,sub,actions=''){return `<div class="page-heading"><div><div class="eyebrow">THREADLINE / ${esc(state.route.toUpperCase())}</div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="button-row">${actions}</div>`:''}</div>`}
function button(action,label,style='primary',extra=''){return `<button class="btn btn-${style}" data-action="${action}" ${extra}>${label}</button>`}
function numClothes(cat){return state.items.filter(i=>!cat||i.category===cat).length}

function renderItemCard(item){return `<article class="item-card"><div class="item-picture">${imageHTML(item)}${item.demo?'<span class="demo-badge">SAMPLE</span>':''}<div class="card-actions"><button title="Edit item" class="round-action" data-edit-item="${esc(item.id)}">${icon('edit',14)}</button></div></div><div class="item-info"><div class="item-name" title="${esc(item.name)}">${esc(item.name)}</div><div class="item-meta">${esc(item.category)} · ${esc(item.color)} · ${esc(item.fit)}</div></div></article>`}
function renderWardrobe(){let list=state.items.filter(i=>(state.wardrobeFilter==='All'||i.category===state.wardrobeFilter)&&(!state.search||`${i.name} ${i.kind} ${i.color} ${(i.tags||[]).join(' ')}`.toLowerCase().includes(state.search.toLowerCase())));return `${pageHead('Your wardrobe','Only items you personally add appear here. Photos are saved locally in this browser.',`${button('add-item',`${icon('plus',15)} Add clothing`)}`)}

function renderStudio(){if(state.studioMode!=='closet')return renderShop(true);

 return `${pageHead('Outfit studio','Create a look only with pieces you have personally uploaded.')}${studioModeBar()}${state.items.length<3?`<div class="panel"><div class="empty"><span class="empty-icon">▧</span><h3>Your closet isn't ready yet.</h3><p>Add at least one top, one pair of pants, and one pair of shoes. Or switch to Discover to explore real retail items right away.</p><button class="btn btn-primary" data-nav="wardrobe">Add garments →</button></div></div>`:`<div class="studio-grid"><div class="panel control-panel"><div class="eyebrow" style="margin-bottom:17px">STYLE YOUR CLOSET</div><div class="field"><label for="inspo-select">Use my inspiration (optional)</label><select class="select" id="inspo-select"><option value="">Surprise me</option>${state.inspos.map(x=>`<option value="${esc(x.id)}" ${reference?.id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label for="occasion-select">Occasion</label><select class="select" id="occasion-select">${['Everyday','Campus','Going out','Polished','Creative'].map(x=>`<option ${state.studioOccasion===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="fit-select">Fit</label><select class="select" id="fit-select">${['Auto','Relaxed','Structured','Mixed'].map(x=>`<option ${state.studioFit===x?'selected':''}>${x}</option>`).join('')}</select></div><details class="advanced-style"><summary>Optional: choose a style direction</summary><div class="field" style="margin-top:12px"><select class="select" id="style-select">${options}</select></div></details><div class="field"><label for="count-select">How many outfits?</label><select class="select" id="count-select">${[3,6,9].map(x=>`<option value="${x}" ${state.studioCount===x?'selected':''}>${x} looks</option>`).join('')}</select></div>${button('generate',`${icon('sparkles')} Generate from my closet`)}</div><div><div class="results-head"><div><h2>${state.generated.length?`${state.generated.length} looks from your closet`:'Ready when you are'}</h2><p class="small muted">Only your uploaded clothing is used here.</p></div></div>${state.generated.length?`<div class="outfit-grid">${state.generated.map(renderOutfit).join('')}</div>`:`<div class="panel"><div class="empty"><h3>Let's style your actual wardrobe.</h3><p>Try Surprise Me. You can still use a saved inspiration reference.</p><button class="btn btn-primary" data-action="generate">Generate looks</button></div></div>`}</div></div>`}`}

${state.inspos.length?`<div class="inspo-grid">${state.inspos.map(i=>`<article class="inspo-card"><div class="inspo-img">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.title)}">`:`${icon('image',55)}`}</div><div class="body"><span class="tiny-label">${esc(i.style||'Your inspiration')}</span><h3>${esc(i.title)}</h3><p>Colors: ${esc(i.colors||'not specified')}<br>Pieces: ${esc(i.pieces||'not specified')}</p><div class="button-row"><button class="btn btn-primary btn-small" data-match-inspo="${esc(i.id)}">Explore inspired looks</button><button class="btn btn-ghost btn-small" data-delete-inspo="${esc(i.id)}" title="Delete inspiration">${icon('trash',14)}</button></div></div></article>`).join('')}</div>`:`<div class="panel"><div class="empty"><span class="empty-icon">▧</span><h3>Your inspiration starts here.</h3><p>Upload a Pinterest screenshot or another outfit photo, add a few notes about what you like, and we'll use it as a styling reference.</p>${button('add-inspo',`${icon('plus')} Add your first reference`)}</div></div>`}`}
function renderSaved(){return `${pageHead('Saved outfits','Your favorite combinations, kept together for another day.')}${state.saved.length?`<div class="outfit-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${state.saved.map(o=>{let missing=o.itemIds.some(id=>!state.items.some(x=>x.id===id));return `<article class="outfit-card">${collage(o)}<div class="outfit-body"><div class="tiny-label">${esc(o.formula)} ${missing?'· SOME ITEMS REMOVED':''}</div><h3>${esc(o.name)}</h3><p>${esc(o.description)}</p><div class="button-row"><button class="btn btn-ghost btn-small" data-view-saved="${esc(o.id)}">${icon('info',14)} Explain</button><button class="btn btn-ghost btn-small" data-remove-saved="${esc(o.id)}">${icon('trash',14)} Remove</button></div></div></article>`}).join('')}</div>`:`<div class="panel"><div class="empty"><span class="empty-icon">♡</span><h3>Save a look you love.</h3><p>Generate a few outfits in the studio, then tap Save on the ones you want to keep.</p><button class="btn btn-primary" data-nav="studio">Go to the studio ${icon('arrow')}</button></div></div>`}`}

function kindOpts(category,selected=''){const kinds={Tops:['tee','graphic tee','oxford shirt','rugby shirt','knit polo','crewneck','collegiate sweatshirt','hoodie','sweater','other top'],Outerwear:['chore jacket','overshirt','utility jacket','denim jacket','varsity jacket','track jacket','cardigan','sweater','blazer','coat','other layer'],Bottoms:['jeans','pleated trousers','chinos','cargo pants','carpenter pants','shorts','other bottoms'],Shoes:['retro sneakers','sneakers','loafers','boots','dress shoes','other shoes'],Accessories:['cap','belt','bag','watch','scarf','other accessory']};let all=kinds[category]||kinds.Tops;if(selected&&!all.includes(selected))all=[...all,selected];return all.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}

async function compressPhoto(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('Please choose an image file.');if(file.size>25*1024*1024)throw Error('Please choose a photo smaller than 25 MB.');let src=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(Error('Could not read photo'));fr.readAsDataURL(file)});let im=await new Promise((res,rej)=>{let img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(Error('Your browser could not decode this image. Try JPG or PNG.'));img.src=src});let scale=Math.min(1,1050/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='#f8f7f3';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.83)}

const rankScores=(item,formula,category,opts={})=>{let score=0,preferred=formula[category.toLowerCase()]||[];let ix=preferred.indexOf(item.kind);score+=ix>=0?14-ix*1.8:-5;for(const tag of formula.types)if((item.tags||[]).includes(tag))score+=2;const favored=(state.prefs.colors||[]);if(favored.includes(item.color))score+=.7;
let occ=state.studioOccasion;if(occ==='Polished'&&['preppy','formal'].some(t=>item.tags.includes(t)))score+=2;if(occ==='Campus'&&['preppy','streetwear'].some(t=>item.tags.includes(t)))score+=2;if(occ==='Going out'&&['preppy','vintage'].some(t=>item.tags.includes(t)))score+=1;
if(state.studioFit==='Relaxed'&&['Relaxed','Oversized'].includes(item.fit))score+=3;if(state.studioFit==='Structured'&&['Regular','Structured','Straight'].includes(item.fit))score+=3;
if(opts.ref){let ref=opts.ref;let cs=String(ref.colors||'').toLowerCase().split(/[,; ]+/).filter(Boolean);if(cs.includes(item.color))score+=6;let piece=String(ref.pieces||'').toLowerCase();if(piece.includes(item.kind.toLowerCase()))score+=12;let words=item.name.toLowerCase().split(' ').filter(w=>w.length>3);for(let w of words)if(piece.includes(w))score+=1.5;}
for(const fb of state.feedback){if(!fb.itemIds?.includes(item.id))continue;let dimension={Tops:'Jacket / top',Outerwear:'Jacket / top',Bottoms:'Pants',Shoes:'Shoes',Accessories:null}[item.category];let rating=fb.ratings?.[dimension];score+=rating==='love'?2.5:rating==='change'?-1.5:0}
if(formula===FORMULAS['Retro Sports Club']&&item.kind==='track jacket')score-=2;return score};
function itemCandidates(cat,formula,opts){return state.items.filter(i=>i.category===cat).map(i=>({item:i,score:rankScores(i,formula,cat==='Outerwear'?'outer':cat==='Bottoms'?'bottom':cat==='Tops'?'top':'shoes',opts)})).sort((a,b)=>b.score-a.score).slice(0,Math.min(7,state.items.filter(i=>i.category===cat).length))}
function colorScore(items){let colors=items.map(i=>i.color),uniq=new Set(colors);let score=0;let neutral=new Set(['navy','gray','white','cream','black','charcoal','beige','tan','brown']);let neutrals=colors.filter(c=>neutral.has(c)).length;score+=neutrals*1.2;score+=uniq.size===2?2:uniq.size===3?1:0;if(colors.includes('navy')&&colors.some(c=>['gray','charcoal','white'].includes(c)))score+=3;if(colors.includes('olive')&&colors.some(c=>['cream','white','beige','black','brown'].includes(c)))score+=2;if(colors.includes('burgundy')&&colors.includes('navy'))score+=1;return score}
function chooseFormulaList(style,count){if(style!=='Surprise Me')return Array(count).fill(STYLE_ALIASES[style]||style);let favorite=state.prefs.favoriteStyles.filter(x=>FORMULAS[x]);if(!favorite.length)favorite=['Everyday Utility','Modern Scholar','Sporty Collegiate'];let exploratory=['Retro Sports Club','Campus Remix','Relaxed Sophistication','Utility Ivy'];let seq=[];for(let i=0;i<count;i++){if(i<Math.ceil(count*.8))seq.push(favorite[i%favorite.length]);else seq.push(exploratory[(i+Math.floor(Math.random()*exploratory.length))%exploratory.length]);}return seq.sort(()=>Math.random()-.5)}
function buildCandidate(fName,ref,used){let formula=FORMULAS[fName]||FORMULAS['Everyday Utility'];let tops=itemCandidates('Tops',formula,{ref}),bottoms=itemCandidates('Bottoms',formula,{ref}),shoes=itemCandidates('Shoes',formula,{ref}),outer=itemCandidates('Outerwear',formula,{ref});if(!tops.length||!bottoms.length||!shoes.length)return null;let candidates=[];
for(const t of tops.slice(0,5))for(const b of bottoms.slice(0,5))for(const s of shoes.slice(0,5)){let layers=outer.length?outer.slice(0,4).concat([{item:null,score:formula.layer?-5:1}]):[{item:null,score:0}];for(let l of layers){let its=[t.item,b.item,s.item,...(l.item?[l.item]:[])];let fp=its.map(x=>x.id).sort().join('/');if(used.has(fp))continue;let balance=colorScore(its);let score=t.score+b.score+s.score+l.score+balance;let n=its.filter(i=>i.color==='navy').length;if(n>2)score-=2; if(fName==='Sporty Collegiate'&&t.item.kind==='rugby shirt')score+=5;if(fName==='Modern Scholar'&&b.item.kind==='jeans')score+=3;if(fName==='Everyday Utility'&&l.item&&l.item.kind==='chore jacket')score+=3;
if(fName==='Retro Sports Club'&&l.item?.kind==='track jacket'&&b.item.kind==='pleated trousers')score-=4;
if(state.studioFit==='Auto'){if(l.item&&['Relaxed','Oversized'].includes(l.item.fit)&&b.item.fit==='Straight')score+=1.5;if(t.item.fit==='Regular'&&b.item.fit==='Relaxed')score+=1.2}
candidates.push({its,fp,score:score+Math.random()*5});}}
if(!candidates.length)return null;candidates.sort((a,b)=>b.score-a.score);let c=candidates[Math.min(Math.floor(Math.random()*Math.min(4,candidates.length)),candidates.length-1)];used.add(c.fp);let top=c.its.find(i=>i.category==='Tops'),bottom=c.its.find(i=>i.category==='Bottoms'),shoe=c.its.find(i=>i.category==='Shoes'),layer=c.its.find(i=>i.category==='Outerwear');let fit=state.studioFit==='Auto'?(layer&&['Relaxed','Oversized'].includes(layer.fit)?'Layered & relaxed':bottom.fit==='Relaxed'?'Relaxed balance':'Classic & easy'):state.studioFit;let title=({ 'Everyday Utility':'Utility in Motion','Modern Scholar':'Off-Duty Scholar','Sporty Collegiate':'The Varsity Edit','Retro Sports Club':'Retro Reframed','Campus Remix':'Campus Layers','Relaxed Sophistication':'Quietly Put Together','Utility Ivy':'The Practical Ivy'})[fName];let colors=[...new Set(c.its.map(i=>i.color))];let desc=`${layer?layer.name+' + ':''}${top.name} + ${bottom.name} + ${shoe.name}.`;
return{id:uid(),fingerprint:c.fp,itemIds:c.its.map(i=>i.id),formula:fName,name:title,description:desc,fit,colors,createdAt:Date.now(),inspirationId:ref?.id||''}}
function generate(){if(['Tops','Bottoms','Shoes'].some(cat=>!state.items.some(i=>i.category===cat))){toast('Add at least one top, bottom and pair of shoes to generate an outfit.');return}let desired=chooseFormulaList(state.studioStyle,state.studioCount),ref=state.inspos.find(x=>x.id===state.studioInspo),used=new Set(),output=[];for(let n of desired){let o=buildCandidate(n,ref,used);if(o)output.push(o)}if(output.length<state.studioCount){let others=Object.keys(FORMULAS);for(let i=0;i<30&&output.length<state.studioCount;i++){let o=buildCandidate(others[i%others.length],ref,used);if(o)output.push(o)}}state.generated=output;render();toast(`${output.length} outfits generated from your wardrobe.`)}
function explanation(o){let pieces=o.itemIds.map(id=>state.items.find(i=>i.id===id)).filter(Boolean),top=pieces.find(i=>i.category==='Tops'),outer=pieces.find(i=>i.category==='Outerwear'),bottom=pieces.find(i=>i.category==='Bottoms'),shoe=pieces.find(i=>i.category==='Shoes'),colors=[...new Set(pieces.map(i=>i.color))];let ref=state.inspos.find(i=>i.id===o.inspirationId);

async function exportData(){let data={app:'threadline',version:1,exportedAt:new Date().toISOString(),items:state.items,inspos:state.inspos,saved:state.saved,feedback:state.feedback,prefs:state.prefs,shoppingV11:{swaps:shopState.swaps,ownedProductIds:shopState.ownedProductIds,saved:shopState.saved,budget:shopState.budget,inspirationId:shopState.inspirationId,ratings:shopState.ratings}};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`threadline-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exported (including clothing photos).')}
async function importData(file){if(!file)return;let data;try{data=JSON.parse(await file.text());if(data.app!=='threadline'||data.version!==1||!Array.isArray(data.items)||!Array.isArray(data.inspos)||!Array.isArray(data.saved)||!Array.isArray(data.feedback))throw Error('Not a valid THREADLINE backup');if(data.items.length>1500)throw Error('Backup contains too many items');}catch(e){toast(e.message);return}if(!confirm('Replace your current wardrobe, inspiration, outfits, feedback and style profile with this backup?'))return;try{for(let s of ['items','inspos','saved','feedback','prefs'])await resetStore(s);for(let s of ['items','inspos','saved','feedback'])for(let row of data[s])if(row&&typeof row.id==='string'&&!(s==='items'&&row.demo))await write(s,row);await write('prefs',{...defaultPrefs,...(data.prefs||{}),id:'user'});await write('meta',{id:'initialized',at:Date.now()});await refresh();if(data.shoppingV11&&typeof data.shoppingV11==='object'){let shopping=data.shoppingV11;shopState.swaps=shopping.swaps&&typeof shopping.swaps==='object'?shopping.swaps:{};shopState.ownedProductIds=Array.isArray(shopping.ownedProductIds)?shopping.ownedProductIds:[];shopState.saved=Array.isArray(shopping.saved)?shopping.saved:[];shopState.ratings=Array.isArray(shopping.ratings)?shopping.ratings:[];shopState.inspirationId=typeof shopping.inspirationId==='string'?shopping.inspirationId:'';shopState.budget=Number.isFinite(shopping.budget)?shopping.budget:250;shopStore()}state.generated=[];render();toast('Backup restored.')}catch(e){console.error(e);toast('Backup import failed. Check available browser storage.')}}

 shopState.selected=best.id;const slots=best.pieces.map(shopProduct).filter(Boolean);let ids=slots.map(p=>p.id),used=new Set();
 // Prefer similar items from the owner's real closet, when reasonably compatible.
 slots.forEach((original,i)=>{let alternatives=[...SHOP_PRODUCTS.filter(p=>p.type===original.type&&!used.has(p.id)).map(p=>({...p,owned:false})),
 ...state.items.filter(it=>({outer:'Outerwear',top:'Tops',bottom:'Bottoms',shoe:'Shoes'})[original.type]===it.category).map(it=>({id:'closet:'+it.id,kind:it.kind,color:it.color,fit:it.fit,tags:it.tags||[],type:original.type,price:0,owned:true,name:it.name}))];
 alternatives=alternatives.map(p=>({p,score:matchProductToReference(p,ref)+(p.kind===original.kind?5:0)+(p.color===original.color?3:0)+(p.owned?5:0)+((!ref&&p.id===original.id)?5:0)})).sort((a,b)=>b.score-a.score);
 const eligible=alternatives.filter(x=>!used.has(x.p.id));if(eligible.length){let choice=eligible[0].p;if(eligible.length>1&&n%3===1&&i===n%slots.length&&eligible[1].score>=eligible[0].score-(ref?5:10))choice=eligible[1].p;ids[i]=choice.id;used.add(choice.id)}else used.add(original.id);
 });
 shopState.swaps[best.id]=ids;shopState.swapSlot=-1;shopStore();return best}
function shopHandleClick(el){if(el.dataset.shopRate){shopRateLook(el.dataset.shopRate);return true}if(el.dataset.shopGenerate){let ref=shopReference();shopGenerateInspired();render();toast(ref?'A new outfit inspired by your saved reference.':'New look using real retailer listings and your closet.');return true}
  if(el.dataset.shopSwap!==undefined){shopState.swapSlot=Number(el.dataset.shopSwap);render();setTimeout(()=>document.querySelector('.shop-alts')?.scrollIntoView({behavior:'smooth',block:'nearest'}),40);return true}
 if(el.dataset.shopClose){shopState.swapSlot=-1;render();return true}
 if(el.dataset.shopUse){let ids=shopLineIds();ids[shopState.swapSlot]=el.dataset.shopUse;shopState.swaps[shopState.selected]=ids;shopState.swapSlot=-1;shopStore();render();return true}
 if(el.dataset.shopBudgetfit){let ids=shopLineIds();const before=shopAmount();let guard=0;while(shopAmount()>shopState.budget&&guard++<10){let best=null;ids.forEach((id,idx)=>{let old=shopResolved(id);if(!old||old.owned)return;let closet=state.items.filter(x=>!x.demo).map(x=>shopResolved('closet:'+x.id)).filter(p=>p&&p.type===old.type&&!ids.includes(p.id));let candidates=[...SHOP_PRODUCTS.filter(x=>x.type===old.type&&x.id!==old.id&&!ids.includes(x.id)).map(x=>shopResolved(x.id)),...closet];for(let p of candidates.filter(x=>x&&!x.owned&&x.price<old.price||x&&x.owned)){let saving=old.price-p.price,score=saving*1.0+(p.kind===old.kind?35:0)+(p.color===old.color?10:0);if(!best||score>best.score)best={idx,id:p.id,score};}});if(!best)break;ids[best.idx]=best.id;shopState.swaps[shopState.selected]=ids;}shopState.swaps[shopState.selected]=ids;shopStore();render();toast(shopAmount()<before?'Selected less expensive available options.':'No cheaper catalog alternatives were available.');return true}
 if(el.dataset.shopSave){let rows=shopLineIds();shopState.saved.push({id:uid(),seed:shopState.selected,name:shopSeed().name,lines:rows,amount:shopAmount(),savedAt:Date.now()});shopStore();render();toast('Shopping outfit saved in this browser.');return true}
 if(el.dataset.shopLoadsaved){let x=shopState.saved.find(s=>s.id===el.dataset.shopLoadsaved);if(x){shopState.selected=x.seed;shopState.swaps[x.seed]=x.lines;shopState.swapSlot=-1;shopStore();render();}return true}
 if(el.dataset.shopRemovesaved){shopState.saved=shopState.saved.filter(s=>s.id!==el.dataset.shopRemovesaved);shopStore();render();return true}return false;}
document.addEventListener('click',e=>{let el=e.target.closest('button');if(el&&Object.keys(el.dataset).some(k=>k.startsWith('shop')))shopHandleClick(el)});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='shop-inspo'){shopState.inspirationId=el.value;shopGenerateInspired();render()}if(el.id==='shop-look'){shopState.selected=el.value;shopState.swapSlot=-1;shopState.inspirationId='';render()}if(el.id==='shop-budget'){shopState.budget=Number(el.value);shopStore();render()}if(el.dataset.shopOwned){let id=el.dataset.shopOwned;shopState.ownedProductIds=el.checked?[...new Set([...shopState.ownedProductIds,id])]:shopState.ownedProductIds.filter(x=>x!==id);shopStore();render()}});
document.addEventListener('input',e=>{if(e.target.id==='shop-budget'){let el=document.getElementById('shop-budget-label');if(el)el.textContent=shopMoney(Number(e.target.value));}});

init();
